; === Configuration file for vessel class SSV OV ===
ClassName = SSV_OV
Module = SSV_OV

; config options
EIUDataRecorder = FALSE
PositionLabelTime = 3
AutoActionLandingGear = TRUE
AutoActionDragChute = TRUE
RHCRate = 0.75
RPTARate = 0.75
BrakeRate = 0.75
Alarm1x = TRUE
; RMS joint and end effector rates decrease as the mass of the captured payload increases (not a real table, a simple model)
RMSPayloadMassEffect = FALSE
; the arm and the payload that it moves push the orbiter (reaction forces; with the DAP in FREE the orbiter turns). Off by default
RMSReaction = FALSE
; the center of mass of the orbiter follows the arm and the payload that it holds (the arm is 410 kg, the payload its mass). Off by default
RMSCenterOfMass = FALSE
; the moments of inertia of the orbiter change with the arm and the payload that it holds. Off by default
RMSInertia = FALSE
; cabin lighting: the floodlights and the lighting of the panels follow the switches and knobs of the panels O6, O8, R10, L9 and A6U (the lights need the local lights of Orbiter)
CabinLighting = TRUE
; free movement of the head in the virtual cockpit: Ctrl+M switches it on, then the arrows and Ins/Del move the head around the position of the station
VCFreeMove = TRUE
