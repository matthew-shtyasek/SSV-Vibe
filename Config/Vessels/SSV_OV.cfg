; === Configuration file for vessel class SSV OV ===
ClassName = SSV_OV
Module = SSV_OV

; config options
EIUDataRecorder = FALSE
PositionLabelTime = 3
AutoActionLandingGear = TRUE
AutoActionDragChute = TRUE
RHCRate = 0.75
RPTARate = 0.75
BrakeRate = 0.75
Alarm1x = TRUE
; RMS joint and end effector rates decrease as the mass of the captured payload increases (not a real table, a simple model)
RMSPayloadMassEffect = FALSE
; the arm and the payload that it moves push the orbiter (reaction forces; with the DAP in FREE the orbiter turns). Off by default
RMSReaction = FALSE
; the center of mass of the orbiter follows the arm and the payload that it holds (the arm is 410 kg, the payload its mass). Off by default
RMSCenterOfMass = FALSE
; the moments of inertia of the orbiter change with the arm and the payload that it holds. Off by default
RMSInertia = FALSE
; the computer supported modes of the arm (single, manual augmented, OPR CMD, AUTO) run in the software of the GPC (PDRS, SM OPS 2, MM 201/202); the arm is controlled with the data bus as in the real vehicle. FALSE: the old direct control
RMSViaGPC = TRUE
; cabin lighting: the floodlights and the lighting of the panels follow the switches and knobs of the panels O6, O8, R10, L9 and A6U (the lights need the local lights of Orbiter)
CabinLighting = TRUE
; calibration of the pointers of the dimmer knobs (live in the Settings MFD): offset of the pointer of the mesh at rest from the middle of the travel [deg], travel [deg], reversed
KnobTopOffset = 0
KnobTopTravel = 300
KnobTopReverse = TRUE
KnobAftOffset = 150
KnobAftTravel = 300
KnobAftReverse = FALSE
KnobL9Offset = 40
KnobL9Travel = 240
KnobL9Reverse = TRUE
KnobR10Offset = -40
KnobR10Travel = 265
KnobR10Reverse = TRUE
; free movement of the head in the virtual cockpit: a key switches it on, then the arrows and Ins/Del move the head around the position of the station (the arrows are used by the THC, so a key is needed)
VCFreeMove = TRUE
; the key (with Ctrl): 0 Home, 1 End, 2 Insert, 3 Delete, 4 Scroll Lock, 5 Grave accent
VCFreeMoveKey = 0
; heating of the hydraulic fluid and of the APU lube oil, cooling of the water spray boilers and the failures from overheating (a lube oil without cooling seizes the bearings of the APU)
HydraulicThermal = TRUE

; floodlights of the middeck (the panel MO13Q is not in the virtual cockpit): 0 = off, 1 = half, 2 = all
MiddeckLights = 2

; random failures of the water spray boilers (to train; each boiler throws the dice at random intervals of 5 to 25 minutes): 0 = off, 1 = one in 20 hours, 2 = one in 5 hours, 3 = one in 1 hour, per boiler
HydraulicRandomFailures = 0
